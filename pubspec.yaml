name: mycrmsync
description: MyCrmSync Flutter hybrid — CRM UI with native Android call/WhatsApp services.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.8.0+1
  http_parser: ^4.1.2
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.1
  intl: ^0.20.2
  collection: ^1.19.1
  equatable: ^2.0.7
  path_provider: ^2.1.5
  record: ^6.0.0
  file_picker: ^9.2.1
  image_picker: ^1.1.2
  permission_handler: ^11.4.0
  audioplayers: ^6.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/whatsapp_icon.png
